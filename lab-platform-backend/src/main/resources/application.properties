spring.application.name=lab-platform-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/lab_platform_db
spring.datasource.username=USER_NAME
spring.datasource.password=USER_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool Memory Optimization (for 512MB RAM Containers)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# Embedded Tomcat Thread Pool Optimization
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=5

jwt.secret=JWT_SECRET
jwt.expiration=86400000

spring.security.oauth2.client.registration.google.client-id=CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.authorization=DEBUG

server.error.include-message=always
server.error.include-binding-errors=always

server.port=${PORT:8080}